name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline regression and installed-runtime tests
        run: python -m unittest discover -s .kiro/tests -q
      - name: Check generated rules
        run: |
          python .kiro/scripts/build_quick_rules.py --check
          python .kiro/scripts/build_diagnosis_rules.py --check
      - name: Check shell installer
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          bash install.sh --kiro-home "$RUNNER_TEMP/humanize install" --dry-run
          bash install.sh --kiro-home "$RUNNER_TEMP/humanize install"
